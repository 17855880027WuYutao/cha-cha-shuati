<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>刷题解析台（单文件版）</title>
<style>
:root{
  --bg:#f7f5f0; --card:#fff; --ink:#23282b; --muted:#8a8a82; --line:#e7e3d9;
  --accent:#2c5a5f; --accent-soft:#e6efee;
  --single:#2c5a5f; --multi:#8a5a2b; --judge:#5d4b8a; --fill:#2f6b46; --short:#7a3d55; --unknown:#777;
  --ok:#2f6b46; --warn:#b26a1f; --bad:#b3372f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft Yahei",system-ui,sans-serif;
  overflow:hidden;
}
#app{height:var(--app-h,100vh);display:flex;flex-direction:column}
header#top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 12px 6px;background:var(--bg);border-bottom:1px solid var(--line);
}
.brand{font-weight:700;font-size:15px;letter-spacing:.3px}
.brand .ver{font-weight:400;font-size:10px;color:var(--muted);margin-left:4px}
.actions{display:flex;gap:6px}
.actions button{font-size:12.5px;padding:5px 10px;border-radius:9px}
button{
  font:inherit;font-size:14px;border:0;border-radius:10px;padding:7px 12px;
  background:var(--accent);color:#fff;font-weight:600;
}
button.ghost{background:var(--accent-soft);color:var(--accent)}
button:active{opacity:.75}

nav#tabs{display:flex;gap:4px;padding:6px 12px 0;background:var(--bg)}
nav#tabs button{
  flex:1;background:transparent;color:var(--muted);border-radius:10px 10px 0 0;
  padding:7px 0;font-size:13.5px;border-bottom:2px solid transparent;
}
nav#tabs button.on{color:var(--accent);background:var(--card);border-bottom-color:var(--accent)}

main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;background:var(--card);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
section{padding:10px 12px 40px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:1px 0 7px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font-size:13px;padding:4px 10px;border-radius:999px;
  background:#f1efe8;color:#5f5d55;border:1px solid transparent;
}
.chip.on{background:var(--accent);color:#fff}
.chip .n{opacity:.75;font-size:11px;margin-left:3px}

#search{
  width:100%;font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;
  border:1px solid var(--line);background:#fbfaf7;margin-bottom:8px;color:var(--ink);
}
#search:focus{outline:2px solid var(--accent-soft)}

.q{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--single);border-radius:12px;padding:11px 12px;margin-bottom:10px}
.q.multi{border-left-color:var(--multi)}
.q.judge{border-left-color:var(--judge)}
.q.fill{border-left-color:var(--fill)}
.q.short{border-left-color:var(--short)}
.q.unknown{border-left-color:var(--unknown)}
.qhead{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.t-multi{background:#f3e8da;color:var(--multi)}
.pill.t-judge{background:#ebe6f5;color:var(--judge)}
.pill.t-fill{background:#e2f0e7;color:var(--fill)}
.pill.t-short{background:#f5e6ec;color:var(--short)}
.pill.t-unknown{background:#eee;color:var(--unknown)}
.qid{font-size:12px;color:var(--muted);font-weight:600}
.conf{font-size:11px;color:var(--muted);margin-left:auto}
.conf.low{color:var(--warn)}
.conf.bad{color:var(--bad)}
.jump{font-size:11px;color:var(--accent);background:var(--accent-soft);border:0;padding:3px 8px;border-radius:8px}
.stem{font-size:15px;line-height:1.6;word-break:break-word}
.stem img{max-width:100%;border-radius:8px;margin:6px 0;display:block}
.stem table.rich{border-collapse:collapse;margin:8px 0;font-size:13px}
.stem table.rich td{border:1px solid var(--line);padding:4px 8px}
.opts{list-style:none;margin:8px 0 0;padding:0}
.opts li{display:flex;gap:8px;padding:4px 0;font-size:14.5px;line-height:1.5;word-break:break-word}
.opts .k{flex:0 0 20px;font-weight:700;color:var(--accent)}
.ans{margin-top:8px;padding:7px 10px;border-radius:9px;background:#f1f6f2;font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.ans.miss{background:#fdf1ee}
.ans .lbl{font-size:11px;color:var(--ok);font-weight:700}
.ans.miss .lbl{color:var(--bad)}
.ans b{color:var(--ok);font-size:15px}
.ans.miss b{color:var(--bad)}
.exp{font-size:12.5px;color:var(--muted);flex-basis:100%}
.issues{margin-top:6px;font-size:12px;color:var(--bad)}

/* 原文 */
.srcline{display:flex;gap:8px;padding:3px 0;font-size:13px;line-height:1.5;border-bottom:1px dotted #f0eee7;word-break:break-word}
.srcline .no{flex:0 0 30px;color:#c3bfb2;font-size:11px;text-align:right;font-variant-numeric:tabular-nums;padding-top:2px}
.srcline .tx{flex:1;color:#5c5c55}
.srcline.sec .tx{font-weight:700;color:var(--ink)}
.srcline.red .tx{color:var(--bad)}
.srcline.hid .tx{color:#b3a7c9;font-style:italic}
.srcline.qa{background:#fffbe9}
.srcline.sect{background:#f4f2ea}
.srcline.hit{outline:2px solid var(--accent);border-radius:4px}
.srcline .tag{flex:0 0 auto;font-size:10px;color:#b9b4a5;padding-top:3px}

/* 报告 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.grid .cell{background:#fbfaf7;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}
.grid .cell b{font-size:17px;display:block}
.grid .cell span{font-size:11px;color:var(--muted)}
h3{font-size:14px;margin:16px 0 8px;color:var(--ink)}
h3 small{font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
.bars .bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.bars .bar .nm{flex:0 0 44px;color:var(--muted)}
.bars .bar .tr{flex:1;height:8px;background:#f1efe8;border-radius:99px;overflow:hidden}
.bars .bar .fl{height:100%;background:var(--accent);border-radius:99px}
.bars .bar .vl{flex:0 0 38px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.issue{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dotted #f0eee7;font-size:13px}
.issue .id{font-weight:600;color:var(--accent);font-size:12px}
.issue .ms{color:var(--bad);font-size:12px}
.stray{font-size:12px;color:var(--muted);padding:3px 0;word-break:break-word}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}
.empty b{color:var(--ink)}

#drop{position:fixed;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:rgba(44,90,95,.88);color:#fff;font-size:20px;font-weight:700;z-index:50;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:#23282b;color:#fff;font-size:13px;padding:9px 15px;border-radius:10px;z-index:60;max-width:86vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* 通用按压反馈 */
button{transition:transform .09s ease,opacity .12s ease,background .16s ease,color .16s ease,border-color .16s ease}
button:active{transform:scale(.955)}
button:disabled{opacity:.85}
.chip:active,nav#tabs button:active{transform:scale(.97)}
.qz-opt{transition:border-color .15s,background .15s,transform .09s}
.qz-opt:active{transform:scale(.985)}

/* 题库浮层 */
#sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:flex;align-items:flex-end}
.sheet-bg{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(30,34,36,.45);animation:fadeIn .18s ease both}
.sheet{position:relative;width:100%;max-height:76vh;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;animation:slideUp .24s cubic-bezier(.22,.8,.36,1) both}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-h b{font-size:16px}
.sheet-x{font-size:12.5px;padding:5px 10px;background:#f1efe8;color:#4a4a44}
#banklist{overflow-y:auto;flex:1;min-height:0}
.bank{display:flex;align-items:center;gap:10px;padding:11px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fbfaf7}
.bank.cur{border-color:var(--accent);background:var(--accent-soft)}
.bank .b-main{flex:1;min-width:0}
.bank .b-nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bank .b-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.bank .b-del{font-size:11.5px;padding:5px 9px;background:#f7ecea;color:#9c3b31;border-radius:8px}
.bank .b-cur{font-size:11px;color:var(--accent);font-weight:700}
.sheet-f{display:flex;gap:8px;margin-top:10px}
.sheet-f button{flex:1;padding:12px;font-size:14px}
.sheet-empty{color:var(--muted);font-size:13px;padding:18px 4px;text-align:center;line-height:1.7}

/* 报告里的标记入口 */
.rep-actions{display:flex;gap:8px;margin:2px 0 12px}
.rep-actions button{flex:1;font-size:12.5px;padding:8px 6px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.rep-actions .favbtn{background:#fdf3d8;color:#8a6420}
.rep-actions .flagbtn{background:#e8f3e9;color:#2f6b46}
.mk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.mk .mk-h{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.mk .mk-stem{font-size:13.5px;line-height:1.5;color:#4a4a44;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mk .mk-a{margin-top:6px;font-size:12.5px;color:var(--ok)}
.mk .mk-del{font-size:11.5px;padding:5px 9px;background:#f7ecea;color:#9c3b31;border-radius:8px;margin-left:auto}
.hist{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dotted #f0eee7;font-size:12.5px}
.hist .when{flex:0 0 78px;color:var(--muted);font-variant-numeric:tabular-nums}
.hist .md{flex:0 0 52px;color:var(--accent);font-weight:600}
.hist .num{flex:1;color:#4a4a44}
.hist .pct{flex:0 0 44px;text-align:right;font-weight:700}
.hist .pct.good{color:var(--ok)}
.hist .pct.bad{color:var(--bad)}
/* 错题本 */
.wrong-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}
.wrong-h .t{font-size:14px;font-weight:600}
.wrong-h button{font-size:12.5px;padding:6px 10px}
.wrong-h .ghost{background:var(--accent-soft);color:var(--accent)}
.wq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;background:var(--card)}
.wq .wq-h{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.wq .wq-n{font-size:11px;color:var(--muted);margin-left:auto}
.wq .wq-stem{font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wq.open .wq-stem{-webkit-line-clamp:unset;display:block}
.wq .wq-ans{margin-top:7px;font-size:12.5px;color:var(--ok);background:#f1f6f2;border-radius:8px;padding:6px 9px}
.wq .wq-more{display:none;margin-top:8px}
.wq.open .wq-more{display:block}
.wq .wq-opt{font-size:13px;line-height:1.7;color:#5c5c55}
.wq .wq-opt b{color:var(--accent);margin-right:5px}

/* 考试 */
.qz-timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--accent)}
.qz-timer.warn{color:var(--bad)}
.qz-prev{font-size:12px;padding:5px 9px;background:#f1efe8;color:#5f5d55;border-radius:8px}
.exam-tip{font-size:12px;color:var(--muted);margin:0 0 8px}
.exam-review{margin-top:6px}
.exam-review .er{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dotted #f0eee7;font-size:13px}
.exam-review .er .ok{color:var(--ok)}
.exam-review .er .no{color:var(--bad)}
.exam-review .er .id{color:var(--muted);font-size:11.5px;flex:0 0 62px}
.exam-review .er .a{color:#5c5c55;font-size:12px}

/* 刷题 */
body.quiz-session header#top,body.quiz-session nav#tabs{display:none}
body.quiz-session #app{padding-top:0}
body.quiz-session main{overflow:hidden;background:var(--bg)}
body.quiz-session #pane-quiz{height:100%;display:flex;flex-direction:column;padding:4px 12px calc(4px + env(safe-area-inset-bottom))}
#quizroot{flex:1;min-height:0;display:flex;flex-direction:column}
.qz-screen{flex:1;min-height:0;display:flex;flex-direction:column}
.qz-main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:4px 0 6px}
.qz-main .qz-card{margin:auto 0;width:100%}
.qz-top{padding:2px 0 7px}
.qz-bottom{flex:0 0 auto;border-top:1px solid var(--line);padding-top:8px;background:var(--bg)}
.qz-cardbtn{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.qz-cardbtn .hintx{font-weight:400;font-size:12px;color:#5d807f}
.qz-tools{display:flex;gap:8px;margin-top:8px}
.qz-tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fbfaf7;border:1px solid var(--line);border-radius:12px;padding:7px 4px;font-size:11.5px;color:#5c5c55;transition:background .15s,border-color .15s,transform .09s}
.qz-tool:active{transform:scale(.96)}
.qz-tool .ic{font-size:16px;line-height:1.1}
.qz-tool.fav{background:#fdf3d8;border-color:#ecd39a;color:#8a6420}
.qz-tool.flag{background:#e8f3e9;border-color:#b9d9bd;color:#2f6b46}
/* 答题卡浮层 */
.bgmask{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(30,34,36,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
.bgmask.on{opacity:1;pointer-events:auto}
.qsheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .24s cubic-bezier(.22,.8,.36,1);z-index:75;box-shadow:0 -10px 30px rgba(0,0,0,.12);max-height:72vh;overflow-y:auto}
.qsheet.open{transform:none}
.qs-h{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:10px}
.qs-h span{font-weight:400;font-size:12px;color:var(--muted)}
.qs-h button{font-size:12px;padding:5px 10px;background:#f1efe8;color:#4a4a44;border-radius:8px}
.qs-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.qs-cell{height:42px;border-radius:9px;background:#f1efe8;color:#6a675d;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;border:0}
.qs-cell.ok{background:#dcefe2;color:#245c3a}
.qs-cell.no{background:#f7dbd7;color:#8f2b22}
.qs-cell.cur{background:var(--accent);color:#fff}
.setup h2{font-size:16px;margin:4px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setup .bank-row{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12px;color:var(--muted)}
.setup .bank-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600;font-size:13px}
.setup .bank-row .chg{font-size:11.5px;padding:4px 9px;background:var(--accent-soft);color:var(--accent);border-radius:8px}
.setup .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.setup .row .mode{flex:1 1 30%;background:#f1efe8;color:#4a4a44;border:none;padding:12px 6px;border-radius:12px;font-size:14px;font-weight:600}
.setup .row .mode.on{background:var(--accent);color:#fff}
.setup .row .amon{flex:1 1 20%;background:#f1efe8;color:#4a4a44;border:none;padding:9px 4px;border-radius:10px;font-size:13px}
.setup .row .amon.on{background:var(--accent-soft);color:var(--accent);outline:1px solid var(--accent)}
.setup .sw{display:flex;align-items:center;gap:10px;font-size:14px;margin:14px 0;color:#4a4a44}
.setup .sw input{width:20px;height:20px;accent-color:var(--accent)}
.setup .go{width:100%;padding:14px;font-size:16px;border-radius:14px}
.setup .num{width:110px;font:inherit;font-size:15px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fbfaf7}
.setup .sub{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.qz-top{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12px;color:var(--muted)}
.qz-bar{flex:1;height:5px;background:#eeece5;border-radius:99px;overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qz-card{border:1px solid var(--line);border-left:3px solid var(--single);border-radius:14px;padding:11px 12px;background:var(--card);animation:qzIn .22s cubic-bezier(.22,.8,.36,1) both}
.qz-card.multi{border-left-color:var(--multi)} .qz-card.judge{border-left-color:var(--judge)}
.qz-card.fill{border-left-color:var(--fill)} .qz-card.short{border-left-color:var(--short)}
.qz-card .stem{font-size:15.5px;line-height:1.62}
@keyframes qzIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.qz-card.leave{animation:qzOut .15s ease-in both}
@keyframes qzOut{to{opacity:0;transform:translateX(-28px)}}
.qz-opts{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.qz-opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fbfaf7;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14.5px;color:var(--ink);line-height:1.5}
.qz-opt .k{flex:0 0 22px;height:22px;border-radius:50%;background:#eceae2;color:#6a675d;font-size:12px;font-weight:700;text-align:center;line-height:22px}
.qz-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.qz-opt.sel .k{background:var(--accent);color:#fff}
.qz-opt.ok{border-color:var(--ok);background:#edf6f0}
.qz-opt.ok .k{background:var(--ok);color:#fff}
.qz-opt.no{border-color:var(--bad);background:#fdf0ee}
.qz-opt.no .k{background:var(--bad);color:#fff}
.qz-fill{display:flex;gap:8px;margin-top:12px}
.qz-fill input{flex:1;font:inherit;font-size:15px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fbfaf7;min-width:0}
.qz-fill input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.qz-cta{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;min-height:48px}
.qz-cta .qz-btn,.qz-cta .qz-next{min-width:54%;max-width:320px}
.qz-btn{padding:11px 16px;border-radius:12px;font-size:15px}
.qz-btn.ghost{background:var(--accent-soft);color:var(--accent)}
.qz-fb{margin-top:12px;border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.6;animation:fbIn .18s ease both}
@keyframes fbIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.qz-fb.ok{background:#edf6f0;color:#245c3a}
.qz-fb.no{background:#fdf0ee;color:#8f2b22}
.qz-fb .lbl{font-weight:700;margin-right:6px}
.qz-next{margin:0;padding:14px 18px;border-radius:14px;font-size:16px}
.qz-done{text-align:center;padding-top:8px}
.qz-done .big{font-size:40px;font-weight:700;color:var(--accent);line-height:1.2}
.qz-done .sm{color:var(--muted);font-size:13px;margin:6px 0 18px}
.qz-done .row{display:flex;gap:10px;margin-top:10px}
.qz-done .row button{flex:1;padding:13px;border-radius:12px;font-size:15px}
.qz-resume{background:#fffbe9;border:1px solid #efe3b8;border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px;color:#6b5a1f}
.qz-resume .row{display:flex;gap:8px;margin-top:9px}
.qz-resume .row button{flex:1;padding:9px;border-radius:10px;font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">刷题解析台<span class="ver">v0.9</span></div>
    <div class="actions">
      <button id="btn-banks" class="ghost">题库</button>
      <button id="btn-import">导入</button>
    </div>
  </header>
  <nav id="tabs">
    <button data-tab="q" class="on">题目</button>
    <button data-tab="src">原文</button>
    <button data-tab="quiz">刷题</button>
    <button data-tab="wrong">错题</button>
    <button data-tab="rep">报告</button>
  </nav>
  <main id="main">
    <section id="pane-q">
      <div class="chips" id="filters"></div>
      <input id="search" type="search" placeholder="搜题干 / 答案">
      <div id="qlist"></div>
      <div id="qempty" class="empty" hidden></div>
    </section>
    <section id="pane-src" hidden>
      <div class="hint" id="srchint">导入后在这里看 Word 的原始行，红字通常是答案。</div>
      <div id="srclist"></div>
      <div id="srcmorewrap"></div>
    </section>
    <section id="pane-rep" hidden>
      <div id="report"></div>
    </section>
    <section id="pane-quiz" hidden>
      <div id="quizroot"></div>
    </section>
    <section id="pane-wrong" hidden>
      <div id="wrongroot"></div>
    </section>
  </main>
</div>
<div id="sheet" hidden>
  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet">
    <div class="sheet-h"><b>我的题库</b><button class="sheet-x" id="sheet-x">关闭</button></div>
    <div id="banklist"></div>
    <div class="sheet-f">
      <button id="sheet-import">导入 Word</button>
      <button id="sheet-sample" class="ghost">加载示例</button>
    </div>
  </div>
</div>
<div class="bgmask" id="qz-mask"></div>
<div class="qsheet" id="qz-sheet">
  <div class="qs-h">答题卡 <span id="qs-meta">0/0 · 已答 0</span><button id="qs-close">收起</button></div>
  <div class="qs-grid" id="qs-grid"></div>
</div>
<div class="bgmask" id="list-mask"></div>
<div class="qsheet" id="list-sheet">
  <div class="qs-h"><span id="list-title">列表</span><button id="list-close">收起</button></div>
  <div id="list-body"></div>
</div>
<div id="drop">松手导入</div>
<div id="toast"></div>
<input type="file" id="file" accept=".docx" hidden>

      let m;
      const attrStr = core.slice(k);
      while ((m = re.exec(attrStr))) attrs[m[1]] = decodeEntities(m[2] !== undefined ? m[2] : m[3]);
      const node = { name, attrs, children: [] };
      stack[stack.length - 1].children.push(node);
      if (!self) stack.push(node);
    }
    return root;
  }

  function kids(node, name) {
    const out = [];
    if (!node || !node.children) return out;
    for (const c of node.children) {
      if (c.name === '#text') continue;
      if (name === undefined || local(c.name) === name) out.push(c);
    }
    return out;
  }
  function kid(node, name) {
    if (!node || !node.children) return null;
    for (const c of node.children) if (c.name !== '#text' && local(c.name) === name) return c;
    return null;
  }
  function deep(node, name, out) {
    out = out || [];
    if (!node || !node.children) return out;
    for (const c of node.children) {
      if (c.name === '#text') continue;
      if (local(c.name) === name) out.push(c);
      deep(c, name, out);
    }
    return out;
  }
  function attr(node, ...names) {
    if (!node || !node.attrs) return undefined;
    for (const nm of names) {
      if (node.attrs[nm] !== undefined) return node.attrs[nm];
      const key = Object.keys(node.attrs).find((k) => local(k) === nm);
      if (key !== undefined) return node.attrs[key];
    }
    return undefined;
  }
  function textOf(node) {
    if (!node) return '';
    if (node.name === '#text') return node.text || '';
    let s = '';
    for (const c of node.children || []) s += textOf(c);
    return s;
  }
  function rootOf(docXml) {
    return kid(docXml, 'document');
  }

  // ---------------------------------------------------------------- 中文数字（自动编号用）
  const CN_DIGITS = '零一二三四五六七八九';
  function cnNumber(n) {
    if (n <= 0) return String(n);
    if (n < 10) return CN_DIGITS[n];
    if (n < 20) return '十' + (n % 10 ? CN_DIGITS[n % 10] : '');
    if (n < 100) return CN_DIGITS[Math.floor(n / 10)] + '十' + (n % 10 ? CN_DIGITS[n % 10] : '');
    return String(n);
  }
  function fmtNumber(n, fmt) {
    switch (fmt) {
      case 'chineseCounting':
      case 'chineseCountingThousand':
      case 'chineseLegalSimplified': return cnNumber(n);
      case 'decimalZero': return n < 10 ? '0' + n : String(n);
      case 'upperLetter': return String.fromCharCode(64 + ((n - 1) % 26) + 1);
      case 'lowerLetter': return String.fromCharCode(96 + ((n - 1) % 26) + 1);
      case 'upperRoman': return roman(n);
      case 'lowerRoman': return roman(n).toLowerCase();
      default: return String(n);
    }
  }
  function roman(num) {
    const map = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'],
      [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
    let s = '';
    for (const [v, sym] of map) while (num >= v) { s += sym; num -= v; }
    return s;
  }

  // ---------------------------------------------------------------- 样式 / 编号
  function parseStyles(xml) {
    const map = new Map();
    if (!xml) return map;
    const doc = parseXml(xml);
    const root = kid(doc, 'styles') || doc;
    for (const st of kids(root, 'style')) {
      const id = attr(st, 'styleId');
      if (!id) continue;
      const nm = attr(kid(st, 'name'), 'val') || '';
      const pPr = kid(st, 'pPr');
      const outline = attr(kid(pPr, 'outlineLvl'), 'val');
      const based = attr(kid(st, 'basedOn'), 'val') || null;
      map.set(id, { id, name: nm, outline: outline !== undefined ? parseInt(outline, 10) : null, based });
    }
    // 沿着 basedOn 补名字（很多中文模板的样式名是 "heading 1" 在英文里，中文界面用 "标题 1"）
    const nameOf = (id, depth) => {
      const s = map.get(id);
      if (!s || depth > 5) return '';
      return s.name + (s.based ? ' ' + nameOf(s.based, depth + 1) : '');
    };
    for (const [id, s] of map) s.fullName = nameOf(id, 0);
    return map;
  }

  function parseNumbering(xml) {
    const nums = new Map();      // numId -> abstractNumId
    const abstracts = new Map(); // abstractNumId -> {levels: {ilvl: {fmt, start, text}}}
    if (!xml) return { nums, abstracts };
    const doc = parseXml(xml);
    const root = kid(doc, 'numbering') || doc;
    for (const an of kids(root, 'abstractNum')) {
      const id = attr(an, 'abstractNumId');
      const levels = {};
      for (const lvl of kids(an, 'lvl')) {
        const il = parseInt(attr(lvl, 'ilvl') || '0', 10);
        levels[il] = {
          start: parseInt(attr(kid(lvl, 'start'), 'val') || '1', 10),
          fmt: attr(kid(lvl, 'numFmt'), 'val') || 'decimal',
          text: attr(kid(lvl, 'lvlText'), 'val') || '',
        };
      }
      abstracts.set(id, { levels });
    }
    for (const num of kids(root, 'num')) {
      const id = attr(num, 'numId');
      const ab = attr(kid(num, 'abstractNumId'), 'val');
      nums.set(id, ab);
    }
    return { nums, abstracts };
  }

  // ---------------------------------------------------------------- 文档块
  function buildBlocks(body, ctx) {
    const blocks = [];
    walk(body, blocks, ctx);
    blocks.forEach((b, i) => { if (b.idx === undefined) b.idx = i; });
    return blocks;
  }
  const DESCEND = new Set(['body', 'txbxContent', 'sdt', 'sdtContent', 'customXml', 'smartTag', 'ins']);
  function walk(container, out, ctx) {
    if (!container || !container.children) return;
    for (const node of container.children) {
      if (node.name === '#text') continue;
      const ln = local(node.name);
      if (ln === 'p') out.push(makeParagraph(node, out.length, ctx));
      else if (ln === 'tbl') out.push(makeTable(node, out.length, ctx));
      else if (ln === 'sectPr' || ln === 'bookmarkStart' || ln === 'bookmarkEnd' || ln === 'pPr') continue;
      else if (DESCEND.has(ln) || kid(node, 'p') || kid(node, 'tbl')) walk(node, out, ctx);
    }
  }

  function makeParagraph(p, idx, ctx) {
    const pPr = kid(p, 'pPr');
    const styleId = attr(kid(pPr, 'pStyle'), 'val') || '';
    const style = ctx.styles.get(styleId);
    const numPr = kid(pPr, 'numPr');
    let numId = null, ilvl = 0, numText = '';
    if (numPr) {
      numId = attr(kid(numPr, 'numId'), 'val');
      ilvl = parseInt(attr(kid(numPr, 'ilvl'), 'val') || '0', 10);
      if (numId && ctx.numbering) numText = nextNumber(ctx, numId, ilvl);
    }
    const outline = attr(kid(pPr, 'outlineLvl'), 'val');
    const para = {
      kind: 'p', idx, styleId,
      styleName: style ? style.name : '',
      styleFull: style ? (style.fullName || style.name) : '',
      outline: outline !== undefined ? parseInt(outline, 10) : null,
      numId, ilvl, numText,
      jc: attr(kid(pPr, 'jc'), 'val'),
      inlines: [],
      flags: { redRatio: 0, hidden: false, white: false, boldRatio: 0 },
    };
    collectInlines(p, para.inlines, ctx, {});
    computeFlags(para);
    return para;
  }

  function nextNumber(ctx, numId, ilvl) {
    const n = ctx.numbering;
    if (!n || !n.nums) return '';
    const abId = n.nums.get(numId);
    const ab = n.abstracts.get(abId);
    if (!ab) return '';
    const key = numId;
    if (!ctx.counters[key]) ctx.counters[key] = {};
    const c = ctx.counters[key];
    c[ilvl] = (c[ilvl] || (ab.levels[ilvl] ? ab.levels[ilvl].start - 1 : 0)) + 1;
    for (const l of Object.keys(c)) if (+l > ilvl) delete c[l];
    const lvl = ab.levels[ilvl] || { text: '', fmt: 'decimal' };
    let out = lvl.text || ('%' + (ilvl + 1) + '.');
    out = out.replace(/%([1-9])/g, (m, d) => {
      const v = c[(+d) - 1] || 1;
      return fmtNumber(v, lvl.fmt);
    });
    return out;
  }

  function runProps(r) {
    const rPr = kid(r, 'rPr');
    const props = { b: false, i: false, u: false, color: null, highlight: null, hidden: false, sz: null };
    if (!rPr) return props;
    if (kid(rPr, 'b')) props.b = attr(kid(rPr, 'b'), 'val') !== '0' && attr(kid(rPr, 'b'), 'val') !== 'false';
    if (kid(rPr, 'i')) props.i = true;
    if (kid(rPr, 'u')) props.u = attr(kid(rPr, 'u'), 'val') !== 'none';
    props.color = attr(kid(rPr, 'color'), 'val') || null;
    const hl = kid(rPr, 'highlight');
    props.highlight = hl ? attr(hl, 'val') : null;
    const vanish = kid(rPr, 'vanish');
    props.hidden = !!vanish && attr(vanish, 'val') !== '0';
    props.sz = attr(kid(rPr, 'sz'), 'val') || null;
    return props;
  }

  function collectInlines(node, out, ctx, inheritProps) {
    for (const c of node.children || []) {
      if (c.name === '#text') {
        if (c.text && c.text.trim()) out.push({ t: 'text', v: c.text, mark: inheritProps });
        else if (c.text) out.push({ t: 'text', v: c.text, mark: inheritProps });
        continue;
      }
      const ln = local(c.name);
      if (ln === 'r') {
        const props = runProps(c);
        for (const rc of c.children) {
          if (rc.name === '#text') continue;
          const rl = local(rc.name);
          if (rl === 't') out.push({ t: 'text', v: textOf(rc), mark: props });
          else if (rl === 'tab') out.push({ t: 'tab' });
          else if (rl === 'br' || rl === 'cr') out.push({ t: 'br' });
          else if (rl === 'drawing' || rl === 'pict' || rl === 'object') addImages(rc, out, ctx, props);
          else if (rl === 'delText') continue;
          else if (rl === 'sym') {
            const ch = attr(rc, 'char');
            if (ch) out.push({ t: 'text', v: String.fromCharCode(parseInt(ch, 16)), mark: props });
          }
        }
      } else if (ln === 'ins' || ln === 'hyperlink' || ln === 'smartTag' || ln === 'sdt' || ln === 'sdtContent' || ln === 'fldSimple') {
        collectInlines(c, out, ctx, inheritProps);
      } else if (ln === 'del') {
        continue;
      } else if (ln === 'oMath' || ln === 'oMathPara') {
        const t = textOf(c).trim();
        if (t) out.push({ t: 'math', v: t });
      } else if (ln === 'pPr' || ln === 'rPr' || ln === 'bookmarkStart' || ln === 'bookmarkEnd') {
        continue;
      } else if (c.children && c.children.length) {
        collectInlines(c, out, ctx, inheritProps);
      }
    }
  }

  function addImages(node, out, ctx, props) {
    const blips = deep(node, 'blip');
    const vml = deep(node, 'imagedata');
    const docPr = deep(node, 'docPr')[0];
    const alt = docPr ? attr(docPr, 'descr') || attr(docPr, 'title') || '' : '';
    for (const b of blips) {
      const rid = attr(b, 'embed') || attr(b, 'link');
      if (rid) out.push({ t: 'img', rid, target: ctx.rels.get(rid) || null, alt, mark: props });
    }
    for (const v of vml) {
      const rid = attr(v, 'id') || attr(v, 'relid');
      if (rid) out.push({ t: 'img', rid, target: ctx.rels.get(rid) || null, alt, mark: props });
    }
    if (!blips.length && !vml.length) out.push({ t: 'text', v: '[图]', mark: props });
  }

  function makeTable(tbl, idx, ctx) {
    const rows = [];
    for (const tr of kids(tbl, 'tr')) {
      const cells = [];
      for (const tc of kids(tr, 'tc')) {
        const cellBlocks = [];
        walk(tc, cellBlocks, ctx);
        const txt = cellBlocks.map(blockText).join('\n').trim();
        cells.push({ blocks: cellBlocks, text: txt, span: parseInt(attr(kid(tc, 'tcPr'), 'gridSpan') || '1', 10) });
      }
      rows.push(cells);
    }
    return { kind: 'table', idx, rows, text: '' };
  }

  function blockText(b) {
    if (!b) return '';
    if (b.kind === 'table') return b.rows.map((r) => r.map((c) => c.text).join(' | ')).join('\n');
    return b.inlines.map((i) => (i.t === 'text' ? i.v : i.t === 'tab' ? '\t' : i.t === 'br' ? '\n' : i.t === 'img' ? '[图]' : i.t === 'math' ? i.v : '')).join('');
  }

  function computeFlags(para) {
    let total = 0, red = 0, bold = 0, white = 0, hidden = 0;
    for (const i of para.inlines) {
      if (i.t !== 'text' || !i.v) continue;
      const len = i.v.length;
      total += len;
      const m = i.mark || {};
      if (m.color && REDS.test(m.color)) red += len;
      if (m.color && /^FFFFFF$/i.test(m.color)) white += len;
      if (m.b) bold += len;
      if (m.hidden) hidden += len;
    }
    para.flags.redRatio = total ? red / total : 0;
    para.flags.boldRatio = total ? bold / total : 0;
    para.flags.whiteRatio = total ? white / total : 0;
    para.flags.hidden = total > 0 && hidden / total > 0.6;
    para.flags.white = total > 0 && white / total > 0.8;
  }

  // ---------------------------------------------------------------- 逻辑行
  function inlinesText(inls) {
    let s = '';
    for (const i of inls) {
      if (i.t === 'text') s += i.v;
      else if (i.t === 'tab') s += '\t';
      else if (i.t === 'br') s += '\n';
      else if (i.t === 'img') s += '[图]';
      else if (i.t === 'math') s += i.v;
    }
    return s;
  }
  function toLines(blocks) {
    const lines = [];
    for (const b of blocks) {
      if (b.kind === 'table') {
        lines.push({ kind: 'table', block: b, text: '', no: lines.length });
        continue;
      }
      let cur = [];
      const flush = () => {
        if (!cur.length) return;
        const text = inlinesText(cur);
        lines.push({
          kind: 'p', block: b, inlines: cur, text, no: lines.length,
          redRatio: b.flags.redRatio, boldRatio: b.flags.boldRatio,
          white: b.flags.white, hidden: b.flags.hidden,
          styleName: b.styleName, styleFull: b.styleFull, outline: b.outline,
          numText: b.numText,
        });
        cur = [];
      };
      for (const i of b.inlines) {
        if (i.t === 'br') flush();
        else cur.push(i);
      }
      flush();
    }
    return lines;
  }

  // ---------------------------------------------------------------- 行分类
  const RE_Q_NUM = /^\s*(\d{1,3})\s*[.．、)）]\s*(?=\S)/;
  const RE_Q_NUM2 = /^\s*第\s*(\d{1,3})\s*题\s*[.．、:：]?\s*/;
  const RE_SECTION = /^\s*[（(]?([一二三四五六七八九十]{1,3})[)）]?\s*[、.．]\s*(.+)$/;
  const RE_SECTION2 = /^\s*第\s*([一二三四五六七八九十\d]{1,3})\s*(部分|章|单元|篇|节|块)\s*[、.．:：]?\s*(.*)$/;
  const RE_ANS = /^\s*[【\[(（]?\s*(参考答案|正确答案|答\s*案|答案)\s*[】\])）]?\s*[:：]?\s*([\s\S]*)$/;
  const RE_EXP = /^\s*[【\[]?\s*(答案解析|试题解析|解析|分析|详解|点评)\s*[】\]]?\s*[:：]?\s*([\s\S]*)$/;
  const RE_OPT_HEAD = /^\s*[（(\[【]?\s*([A-Ha-h])\s*[）)\]】]?\s*[.．、:：)）]\s*/;
  const RE_CIRCLED_HEAD = /^\s*([①-⑩])\s*[.．、:：)）]?\s*/;
  const JUDGE_WORDS = /^(对|错|正确|错误|√|×|✓|✗|T|F|是|否|True|False)$/i;

  function typeFromName(name) {
    const s = (name || '').replace(/\s/g, '');
    if (/单选|单项选择|单选题/.test(s)) return 'single';
    if (/不定项|多项选择|多选题|多选/.test(s)) return 'multi';
    if (/判断|是非|对错|判断题/.test(s)) return 'judge';
    if (/填空/.test(s)) return 'fill';
    if (/简答|问答|论述|名词解释|案例分析|材料分析|辨析|计算|综合题|阅读/.test(s)) return 'short';
    return null;
  }
  function looksLikeOptionLine(t) {
    return /^[（(\[【]?\s*[A-Ha-h]\s*[）)\]】]?\s*[.．、:：)）]/.test(t) || /^[①-⑩]/.test(t);
  }
  function isSectionLine(line) {
    const t = line.text.trim();
    if (!t || t.length > 40) return false;
    // 选项行、题号行永远不是节标题（「A、 判断产品合格与否」这种最容易误判）
    if (looksLikeOptionLine(t) || RE_Q_NUM.test(t) || /^第\s*\d/.test(t)) return false;
    const m1 = t.match(RE_SECTION);
    if (m1) {
      const tail = m1[2].trim();
      return tail.length <= 30 && (typeFromName(tail) || /题|部分|篇|章/.test(tail) || t.length <= 8);
    }
    const m2 = t.match(RE_SECTION2);
    if (m2) return true;
    // 纯题型名单独成行：「判断题」「一、单选题」之类，必须整行只有题型词
    if (t.length <= 12 && /^[（(]?\s*(单项选择|多项选择|单选|多选|判断|填空|简答|问答|论述)题?\s*([（(][^)）]{0,10}[)）])?\s*$/.test(t)) return true;
    return false;
  }
  function isExplanationLine(line) {
    return RE_EXP.test(line.text.trim());
  }
  function isAnswerLine(line) {
    return RE_ANS.test(line.text.trim());
  }

  // 把一个选项行拆成若干选项（A/B/C/D 或 ①②③④）
  function splitOptions(rawText, expectedFirstKey) {
    const t = rawText.replace(/\u3000/g, ' ').replace(/\t/g, ' ');
    const marks = [];
    // 字母标记：A. / A、 / A) / （A）
    const re = /[（(\[【]?\s*([A-Ha-h])\s*[）)\]】]?\s*[.．、:：)）]|([①-⑩])/g;
    let m;
    while ((m = re.exec(t))) {
      const key = m[1] ? m[1].toUpperCase() : circledToLetter(m[2]);
      const pos = m.index;
      const prev = pos > 0 ? t[pos - 1] : '';
      const prevOk = pos === 0 || /[\s\t，,；;。：:]/.test(prev) || /[）)\]】]/.test(prev);
      if (!prevOk && marks.length === 0) continue;
      if (!prevOk && marks.length > 0) {
        const last = marks[marks.length - 1].key;
        const li = LETTERS.indexOf(last), ci = LETTERS.indexOf(key);
        if (ci !== li + 1) continue;
      }
      marks.push({ key, pos, end: re.lastIndex });
    }
    if (!marks.length) return null;
    // 首标记：要么从 A 开始，要么接着上一行的字母往下排
    const firstKey = marks[0].key;
    const fi = LETTERS.indexOf(firstKey);
    if (expectedFirstKey !== undefined) {
      if (fi !== LETTERS.indexOf(expectedFirstKey)) return null;
    } else if (fi > 1) {
      return null;
    }
    const prefix = t.slice(0, marks[0].pos).trim();
    const opts = [];
    for (let i = 0; i < marks.length; i++) {
      const start = marks[i].end;
      const stop = i + 1 < marks.length ? marks[i + 1].pos : t.length;
      let body = t.slice(start, stop).trim();
      body = body.replace(/\s+$/, '');
      if (!body && i === marks.length - 1) opts.push({ key: marks[i].key, text: '' });
      else opts.push({ key: marks[i].key, text: body });
    }
    // 字母要连续升序
    for (let i = 1; i < opts.length; i++) {
      if (LETTERS.indexOf(opts[i].key) !== LETTERS.indexOf(opts[i - 1].key) + 1) return null;
    }
    return { prefix, options: opts };
  }

  function parseAnswerRaw(raw) {
    let s = (raw || '').trim();
    let explanation = '';
    let cut = -1, cutLen = 0;
    let em = s.match(/【\s*(?:解析|答案解析|分析|详解)\s*】/);
    if (em) { cut = em.index; cutLen = em[0].length; }
    if (cut < 0) {
      em = s.match(/(?:^|[\s，,；;。])(?:解析|答案解析|分析|详解)\s*[:：]/);
      if (em) { cut = em.index; cutLen = em[0].length; }
    }
    if (cut > 0) {
      explanation = s.slice(cut + cutLen).trim();
      s = s.slice(0, cut).trim();
    }
    s = s.replace(/^[:：]\s*/, '').trim();
    let judge = null;
    if (JUDGE_WORDS.test(s)) {
      const v = s.toUpperCase();
      judge = ['对', '正确', '√', '✓', 'T', '是', 'TRUE'].includes(v) ? 'T' : 'F';
    }
    // 纯字母答案
    let letters = null;
    if (/^[A-Ha-h][A-Ha-h\s、,，和及;；\/]{0,20}$/.test(s)) {
      const ls = (s.toUpperCase().match(/[A-H]/g) || []);
      if (ls.length && /^[A-Ha-h\s、,，和及;；\/]+$/.test(s)) letters = [...new Set(ls)];
    }
    return { letters, judge, text: s, explanation };
  }

  // ---------------------------------------------------------------- 主分割
  function segment(doc, ctx) {
    const lines = toLines(ctx.blocks);
    const out = { titleLines: [], sections: [], questions: [], strayLines: [], tableBank: false };
    let curSection = null;
    let curQ = null;
    let lastNum = 0;
    let pendingAnswerMode = false;
    const answerKey = [];   // {sectionKey, number, answer}
    const consumed = new Array(lines.length).fill(false);

    const flushQ = () => {
      if (!curQ) return;
      finishQuestion(curQ, out);
      out.questions.push(curQ);
      curQ = null;
    };
    const startSection = (name, type) => {
      flushQ();
      const key = name.replace(/[（(].*?[)）]/g, '').replace(/\s/g, '');
      curSection = {
        key, name, type: type || typeFromName(name) || 'unknown',
        count: 0, numIds: [],
      };
      out.sections.push(curSection);
      lastNum = 0;
    };

    for (let li = 0; li < lines.length; li++) {
      const line = lines[li];
      const t = (line.text || '').replace(/\u3000/g, ' ').trim();

      if (line.kind === 'table') {
        // 表格：要么是题目自带表格，要么是「题号/答案」答案表
        const tbl = line.block;
        const header = (tbl.rows[0] || []).map((c) => c.text);
        if (isAnswerTable(header)) {
          parseAnswerTable(tbl, answerKey);
          consumed[li] = true;
          continue;
        }
        if (curQ) {
          curQ.stem.push({ t: 'table', rows: tableToAst(tbl) });
          consumed[li] = true;
          continue;
        }
        out.strayLines.push({ no: line.no, text: '[表格] ' + header.join(' | ').slice(0, 60) });
        consumed[li] = true;
        continue;
      }

      if (!t && !tblHasImages(line)) continue;

      // 1. 大节标题
      if (isSectionLine(line)) {
        const m = t.match(RE_SECTION) || t.match(RE_SECTION2);
        const name = m ? (m[3] !== undefined ? (m[3] || m[2]) : m[2]) : t;
        if (/^答案|^参考答案/.test(t)) {
          pendingAnswerMode = true;
          flushQ();
          consumed[li] = true;
          continue;
        }
        startSection(name || t, typeFromName(name) || typeFromName(t));
        consumed[li] = true;
        continue;
      }

      // 1.5 独立的「参考答案 / 答案 / 答案与解析」标题 → 进入文末答案区
      if (t.length <= 14 && /^[（(]?[一二三四五六七八九十\d]{0,2}[)）]?[、.．]?\s*(参考答案|答案与解析|答案及解析|答案|标准答案)\s*$/.test(t)) {
        pendingAnswerMode = true;
        flushQ();
        consumed[li] = true;
        continue;
      }

      // 2. 答案行
      if (isAnswerLine(line) && !pendingAnswerMode) {
        const m = t.match(RE_ANS);
        const raw = m ? m[2] : '';
        const parsed = parseAnswerRaw(raw);
        if (curQ) {
          applyAnswer(curQ, parsed);
          consumed[li] = true;
          continue;
        }
        consumed[li] = true;
        continue;
      }

      // 3. 解析行
      if (isExplanationLine(line) && curQ) {
        const m = t.match(RE_EXP);
        const txt = m ? m[2].trim() : t;
        if (txt) (curQ.explanation || (curQ.explanation = [])).push({ t: 'text', v: txt });
        consumed[li] = true;
        continue;
      }

      // 4. 新题目
      const qm = t.match(RE_Q_NUM2) || t.match(RE_Q_NUM);
      if (qm) {
        let num = parseInt(qm[1], 10);
        const rest = t.slice(qm[0].length).trim();
        const okNum = num === lastNum + 1 || num === 1 || (lastNum === 0) || (num > lastNum && num - lastNum <= 30);
        const looksQ = rest.length > 0 || line.block.inlines.some((i) => i.t === 'img');
        if (okNum && looksQ && !pendingAnswerMode) {
          flushQ();
          curQ = {
            number: num,
            sectionKey: curSection ? curSection.key : '题目',
            sectionName: curSection ? curSection.name : '题目',
            sectionType: curSection ? curSection.type : 'unknown',
            stem: [], options: [], answer: null, explanation: null,
            issues: [], source: { from: li, to: li, blockFrom: line.block.idx, blockTo: line.block.idx },
            redRatio: line.redRatio,
          };
          lastNum = num;
          pushLineRich(curQ.stem, line, rest);
          consumed[li] = true;
          continue;
        }
      }

      // 5. 选项
      const lastKey = curQ && curQ.options.length ? curQ.options[curQ.options.length - 1].key : null;
      const expectKey = lastKey ? LETTERS[LETTERS.indexOf(lastKey) + 1] : undefined;
      const optRes = splitOptions(t, expectKey);
      if (curQ && optRes && optRes.options.length) {
        if (optRes.prefix) pushText(curQ.stem, optRes.prefix, line, li);
        for (const o of optRes.options) {
          if (!o.text) continue;
          curQ.options.push({ key: o.key, content: [{ t: 'text', v: o.text }] });
        }
        consumed[li] = true;
        continue;
      }

      // 6. 答案表模式里的条目
      if (pendingAnswerMode) {
        const pairs = parseAnswerPairs(t);
        if (pairs.length) {
          for (const p of pairs) answerKey.push({ sectionKey: curSection ? curSection.key : null, number: p.number, answer: p.answer });
          consumed[li] = true;
          continue;
        }
        consumed[li] = true;
        continue;
      }

      // 7. 红字/白字/隐藏字兜底当答案
      const looksLikeAns = t.length > 0 && t.length <= 24 && (line.redRatio > 0.6 || line.white || line.hidden);
      if (curQ && looksLikeAns && !curQ.answer) {
        const parsed = parseAnswerRaw(t.replace(/^[【\[(（]?\s*答\s*案\s*[】\])）]?\s*[:：]?\s*/, ''));
        if (parsed.letters || parsed.judge || parsed.text.length <= 20) {
          applyAnswer(curQ, parsed);
          consumed[li] = true;
          continue;
        }
      }

      // 8. 归到题干 / 上一个选项
      if (curQ) {
        const lastOpt = curQ.options[curQ.options.length - 1];
        const candidates = [lastOpt && lastOpt.content, curQ.stem];
        // 选项还没收完且最后一行像接续
        if (lastOpt && !/[。？?]$/.test(lastOptText(lastOpt.content)) && t.length < 60 && curQ.answer === null) {
          lastOpt.content.push({ t: 'text', v: t });
        } else {
          pushLineRich(curQ.stem, line, t);
        }
        consumed[li] = true;
        continue;
      }

      // 9. 章节前的标题
      if (!curSection && out.questions.length === 0) {
        out.titleLines.push(t);
        consumed[li] = true;
        continue;
      }
      out.strayLines.push({ no: line.no, text: t.slice(0, 80) });
      consumed[li] = true;
    }
    flushQ();
    // 回填答案并重新打分
    backfillAnswers(out.questions, answerKey);
    for (const q of out.questions) rescore(q);
    return { out, lines, consumed };
  }

  function tblHasImages(line) { return line.block && line.block.inlines && line.block.inlines.some((i) => i.t === 'img'); }
  function lastOptText(opt) {
    const content = Array.isArray(opt) ? opt : (opt && opt.content) || [];
    return content.map((c) => (c.t === 'text' ? c.v : '')).join('');
  }
  function pushText(arr, text, line, li) {
    if (!text) return;
    arr.push({ t: 'text', v: text, mark: undefined });
  }
  // 续行：文字之外把图片、公式节点也带上
  function pushLineRich(arr, line, text) {
    if (text) arr.push({ t: 'text', v: text });
    for (const inl of line.inlines) {
      if (inl.t === 'img' || inl.t === 'math') arr.push(inl);
    }
  }

  function applyAnswer(q, parsed) {
    if (!q.answer) {
      q.answer = parsed;
    } else if (parsed.letters && !q.answer.letters) {
      q.answer = parsed;
    }
    if (parsed.explanation) {
      (q.explanation || (q.explanation = [])).push({ t: 'text', v: parsed.explanation });
    }
  }

  function isAnswerTable(headerTexts) {
    const h = headerTexts.join(' ').replace(/\s/g, '');
    if (!h) return false;
    return /题号|序号/.test(h) && /答案|正确选项/.test(h) && h.length <= 40;
  }
  function parseAnswerTable(tbl, answerKey) {
    let numCol = 0, ansCol = 1;
    const head = tbl.rows[0].map((c) => c.text);
    head.forEach((t, i) => {
      if (/题号|序号/.test(t)) numCol = i;
      if (/答案|正确选项/.test(t)) ansCol = i;
    });
    for (let r = 1; r < tbl.rows.length; r++) {
      const row = tbl.rows[r];
      const n = parseInt((row[numCol] || {}).text || '', 10);
      const a = (row[ansCol] || {}).text || '';
      if (!isNaN(n) && a) {
        const p = parseAnswerRaw(a);
        answerKey.push({ sectionKey: null, number: n, answer: p });
      }
    }
  }
  function tableToAst(tbl) {
    return tbl.rows.map((r) => r.map((c) => c.blocks.map((b) => (b.kind === 'p' ? b.inlines : [{ t: 'text', v: blockText(b) }]))));
  }

  function parseAnswerPairs(text) {
    const out = [];
    // 1.B 2.A 3.C   或   1、B 2、A
    const re = /(\d{1,3})\s*[.．、:：)）]\s*([A-Ha-h]{1,8}|对|错|正确|错误|√|×)/g;
    let m;
    while ((m = re.exec(text))) {
      const p = parseAnswerRaw(m[2]);
      out.push({ number: parseInt(m[1], 10), answer: p });
    }
    if (out.length) return out;
    // 单独一行 "B" 前面没有题号 → 忽略
    return out;
  }

  function backfillAnswers(questions, answerKey) {
    if (!answerKey.length) return;
    const noAns = questions.filter((q) => !q.answer);
    if (!noAns.length) return;
    // 把答案条目按「题号重新从 1 开始」切成若干段
    const runs = [];
    let cur = [];
    for (const k of answerKey) {
      if (cur.length && k.number <= cur[cur.length - 1].number) { runs.push(cur); cur = []; }
      cur.push(k);
    }
    if (cur.length) runs.push(cur);
    // 有缺答案的分节（按题目出现顺序）
    const secOrder = [];
    const secMap = new Map();
    for (const q of noAns) {
      if (!secMap.has(q.sectionKey)) { secMap.set(q.sectionKey, []); secOrder.push(q.sectionKey); }
      secMap.get(q.sectionKey).push(q);
    }
    const bySection = runs.length === secOrder.length;
    runs.forEach((run, i) => {
      const sec = bySection ? secOrder[i] : null;
      for (const k of run) {
        const cands = noAns.filter((q) => q.number === k.number && (!k.sectionKey || k.sectionKey === q.sectionKey));
        let target = null;
        if (sec) target = cands.find((q) => q.sectionKey === sec) || null;
        else if (cands.length === 1) target = cands[0];
        else if (cands.length) target = cands.find((q) => !q.answer) || null;
        if (target && !target.answer) target.answer = k.answer;
      }
    });
    for (const q of noAns) {
      if (q.answer) continue;
      const hit = answerKey.find((k) => k.number === q.number && (!k.sectionKey || k.sectionKey === q.sectionKey));
      if (hit) q.answer = hit.answer;
    }
  }

  // ---------------------------------------------------------------- 成型与质检
  function finishQuestion(q, out) {
    const section = out.sections.find((s) => s.key === q.sectionKey);
    if (section) section.count++;
    inferType(q);
    scoreQuestion(q);
    q.id = (q.sectionKey || '题') + '-' + q.number;
  }

  function rescore(q) {
    if (!q.answer) return;
    q.issues = q.issues.filter((x) => !['无答案', '填空无答案'].includes(x));
    const keep = q.issues;
    scoreQuestion(q, keep);
  }

  function inferType(q) {
    // 题干里混进来的「答案：」再抽一次
    const stemText = stemPlain(q.stem);
    const inlineAns = stemText.match(/[【\[]?\s*答\s*案\s*[】\]]?\s*[:：]\s*([^\n]{1,24})/);
    if (inlineAns && !q.answer) {
      const p = parseAnswerRaw(inlineAns[1]);
      q.answer = p;
      q.stem = q.stem.map((n) => (n.t === 'text' ? { ...n, v: n.v.replace(inlineAns[0], '') } : n));
    }
    // 题干里带「（多选）」提示
    if (/[（(]\s*(多选|多选题|不定项)\s*[)）]/.test(stemText)) q.typeHint = 'multi';
    if (/[（(]\s*(单选|单选题)\s*[)）]/.test(stemText)) q.typeHint = 'single';
    if (/[（(]\s*判断\s*[)）]/.test(stemText)) q.typeHint = 'judge';
    // 判断题自动补选项
    const optTexts = q.options.map((o) => lastOptText(o.content).trim());
    if (!q.options.length && q.answer && q.answer.judge) {
      q.options = [{ key: 'A', content: [{ t: 'text', v: '对' }] }, { key: 'B', content: [{ t: 'text', v: '错' }] }];
    }
    // 题型
    let type = q.sectionType;
    if (q.typeHint) type = q.typeHint;
    if (!type || type === 'unknown') {
      if (q.options.length >= 2) {
        type = q.answer && q.answer.letters && q.answer.letters.length > 1 ? 'multi' : 'single';
        if (q.options.length === 2 && optTexts.every((x) => JUDGE_WORDS.test(x))) type = 'judge';
      } else if (!q.options.length) {
        type = q.answer && q.answer.judge ? 'judge' : (q.answer && q.answer.text && q.answer.text.length > 16 ? 'short' : 'fill');
      } else {
        type = 'single';
      }
    }
    q.type = type;
    // 答案归一
    if (q.answer) {
      if (q.type === 'judge' && !q.answer.judge && q.answer.letters) {
        const idx = LETTERS.indexOf(q.answer.letters[0]);
        q.answer.judge = idx === 0 ? 'T' : idx === 1 ? 'F' : null;
      }
      if ((q.type === 'single' || q.type === 'multi' || q.type === 'judge') && !q.answer.letters && q.answer.judge) {
        q.answer.letters = [q.answer.judge === 'T' ? 'A' : 'B'];
      }
      if (!q.answer.text) q.answer.text = (q.answer.letters || []).join('');
    }
  }

  function scoreQuestion(q, existingIssues) {
    const issues = Array.isArray(existingIssues) ? existingIssues : [];
    const add = (msg) => { if (!issues.includes(msg)) issues.push(msg); };
    const stemText = stemPlain(q.stem);
    let conf = 1;
    if (!q.answer) { conf -= 0.35; add('无答案'); }
    if (['single', 'multi', 'judge'].includes(q.type)) {
      if (q.options.length === 0 && !(q.type === 'judge' && q.answer)) { conf -= 0.4; add('无选项'); }
      else if (q.options.length === 1) { conf -= 0.25; add('选项不足'); }
      const keys = q.options.map((o) => o.key);
      if (q.answer && q.answer.letters) {
        const bad = q.answer.letters.filter((l) => !keys.includes(l));
        if (bad.length && keys.length) { conf -= 0.25; add('答案不在选项内'); }
        if (q.type === 'single' && q.answer.letters.length > 1) { conf -= 0.15; add('单选多答案'); }
      }
    }
    if (q.type === 'fill' && (!q.answer || !q.answer.text)) { conf -= 0.2; add('填空无答案'); }
    if (!stemText && !q.stem.some((n) => n.t === 'img' || n.t === 'table')) { conf -= 0.4; add('题干空'); }
    if (q.stem.length && stemText.length < 4) { conf -= 0.1; add('题干过短'); }
    q.confidence = Math.max(0, Math.min(1, conf));
    q.issues = issues;
  }

  function stemPlain(stem) {
    return stem.map((n) => (n.t === 'text' ? n.v : n.t === 'img' ? '[图]' : n.t === 'table' ? '[表]' : n.t === 'math' ? n.v : '')).join('');
  }

  // ---------------------------------------------------------------- 表格题库模式
  function tableBankQuestions(blocks) {
    const out = [];
    for (const b of blocks) {
      if (b.kind !== 'table' || !b.rows.length) continue;
      const head = b.rows[0].map((c) => c.text.trim());
      const h = head.join('|');
      if (!/题目|题干|问题|试题/.test(h)) continue;
      const cols = { stem: -1, answer: -1, explanation: -1, type: -1, opts: {} };
      head.forEach((t, i) => {
        const s = t.replace(/\s/g, '');
        if (/题目|题干|问题|试题/.test(s)) cols.stem = i;
        else if (/答案|正确选项/.test(s)) cols.answer = i;
        else if (/解析/.test(s)) cols.explanation = i;
        else if (/题型|类型/.test(s)) cols.type = i;
        else if (/选项/.test(s) || /^[A-H]$/.test(s)) {
          const m = s.match(/[A-H]/);
          if (m) cols.opts[m[0]] = i;
        }
      });
      if (cols.stem < 0) continue;
      for (let r = 1; r < b.rows.length; r++) {
        const row = b.rows[r];
        const cell = (i) => (i >= 0 && row[i] ? row[i].text.trim() : '');
        const stemTxt = cell(cols.stem);
        if (!stemTxt) continue;
        const q = {
          number: r, sectionKey: '表格题库', sectionName: '表格题库',
          sectionType: typeFromName(cell(cols.type)) || 'unknown',
          stem: [{ t: 'text', v: stemTxt }], options: [], answer: null, explanation: null,
          issues: [], source: { from: 0, to: 0, blockFrom: b.idx, blockTo: b.idx },
          fromTable: true,
        };
        const optKeys = Object.keys(cols.opts).sort();
        for (const k of optKeys) {
          const v = cell(cols.opts[k]);
          if (v) q.options.push({ key: k, content: [{ t: 'text', v }] });
        }
        // 选项挤在一列里
        if (!q.options.length) {
          const merged = head.map((t, i) => (/选项/.test(t) ? cell(i) : '')).join(' ');
          const sp = splitOptions(merged);
          if (sp) q.options = sp.options.map((o) => ({ key: o.key, content: [{ t: 'text', v: o.text }] }));
        }
        const ansTxt = cell(cols.answer);
        if (ansTxt) q.answer = parseAnswerRaw(ansTxt);
        const expTxt = cell(cols.explanation);
        if (expTxt) q.explanation = [{ t: 'text', v: expTxt }];
        out.push(q);
      }
    }
    return out;
  }

  // ---------------------------------------------------------------- 入口
  async function parseDocx(input, opts) {
    opts = opts || {};
    const JSZip = opts.jszip || (typeof global.JSZip !== 'undefined' ? global.JSZip : null);
    if (!JSZip) throw new Error('需要 JSZip');
    const zip = opts.zip || await JSZip.loadAsync(input);
    const read = async (p) => {
      const f = zip.file(p);
      return f ? f.async('string') : null;
    };
    const [docXml, stylesXml, numberingXml, relsXml] = await Promise.all([
      read('word/document.xml'), read('word/styles.xml'),
      read('word/numbering.xml'), read('word/_rels/document.xml.rels'),
    ]);
    if (!docXml) throw new Error('不是 .docx（找不到 word/document.xml）');

    const rels = new Map();
    if (relsXml) {
      const rdoc = parseXml(relsXml);
      const rroot = kid(rdoc, 'Relationships') || rdoc;
      for (const r of kids(rroot, 'Relationship')) {
        const id = attr(r, 'Id');
        let target = attr(r, 'Target') || '';
        if (!id || !target) continue;
        if (target.startsWith('/')) target = target.slice(1);
        else if (!target.startsWith('word/')) target = 'word/' + target.replace(/^\.\//, '');
        rels.set(id, target);
      }
    }

    const styles = parseStyles(stylesXml);
    const numbering = parseNumbering(numberingXml);
    const doc = parseXml(docXml);
    const body = rootOf(doc);
    if (!body) throw new Error('文档结构异常');
    const ctx = { styles, numbering, rels, counters: {} };
    const blocks = buildBlocks(body, ctx);

    // 表格题库：文档主体就是一张表
    let questions = [];
    let sections = [];
    let titleLines = [];
    let strayLines = [];
    let usedTableBank = false;

    const seg = segment(doc, { blocks });
    if (seg.out.questions.length === 0) {
      const bank = tableBankQuestions(blocks);
      if (bank.length) {
        usedTableBank = true;
        questions = bank;
        sections = [{ key: '表格题库', name: '表格题库', type: 'unknown', count: bank.length }];
      }
    } else {
      questions = seg.out.questions;
      sections = seg.out.sections;
      titleLines = seg.out.titleLines;
      strayLines = seg.out.strayLines;
    }

    // 题号连续性检查
    const bySection = new Map();
    for (const q of questions) {
      if (!bySection.has(q.sectionKey)) bySection.set(q.sectionKey, []);
      bySection.get(q.sectionKey).push(q);
    }
    for (const [key, list] of bySection) {
      list.sort((a, b) => a.number - b.number);
      let prev = null;
      for (const q of list) {
        if (prev !== null && q.number !== prev + 1) {
          q.issues.push('题号不连续');
          q.confidence = Math.max(0, q.confidence - 0.05);
        }
        prev = q.number;
      }
    }

    // 图片：交给调用方决定怎么变成 URL
    const mediaTargets = new Set();
    const collectImgs = (arr) => {
      for (const n of arr || []) {
        if (n.t === 'img' && n.target) mediaTargets.add(n.target);
        else if (n.t === 'table') for (const row of n.rows) for (const cell of row) for (const blk of cell) collectImgs(blk);
      }
    };
    for (const q of questions) {
      collectImgs(q.stem);
      for (const o of q.options) collectImgs(o.content);
      collectImgs(q.explanation);
    }
    if (opts.mediaUrl) {
      for (const target of mediaTargets) {
        const f = zip.file(target);
        if (!f) continue;
        try {
          const bytes = await f.async('uint8array');
          const url = await opts.mediaUrl(target, bytes);
          if (url) ctx.mediaUrls = ctx.mediaUrls || new Map(), ctx.mediaUrls.set(target, url);
        } catch (e) { /* ignore */ }
      }
      const fix = (arr) => {
        for (const n of arr || []) {
          if (n.t === 'img' && n.target && ctx.mediaUrls && ctx.mediaUrls.has(n.target)) n.src = ctx.mediaUrls.get(n.target);
          else if (n.t === 'table') for (const row of n.rows) for (const cell of row) for (const blk of cell) fix(blk);
        }
      };
      for (const q of questions) {
        fix(q.stem);
        for (const o of q.options) fix(o.content);
        fix(q.explanation);
      }
    }

    // 题干重复检查（题库本身可能有问题）
    const dupMap = new Map();
    for (const q of questions) {
      const k = stemPlain(q.stem).replace(/\s/g, '').replace(/[（(]\s*[)）]/g, '').slice(0, 60);
      if (k.length < 6) continue;
      if (!dupMap.has(k)) dupMap.set(k, []);
      dupMap.get(k).push(q);
    }
    const duplicates = [];
    for (const [k, list] of dupMap) {
      if (list.length < 2) continue;
      const ansSet = new Set(list.map((q) => (q.answer && (q.answer.text || (q.answer.letters || []).join(''))) || ''));
      const conflict = ansSet.size > 1;
      duplicates.push({ stem: k, ids: list.map((q) => q.id), answers: list.map((q) => (q.answer && q.answer.text) || ''), conflict });
      for (const q of list) {
        if (conflict) { q.issues.push('重复题(答案不一致)'); q.confidence = Math.max(0, q.confidence - 0.1); }
      }
    }

    // 统计
    const byType = {};
    for (const q of questions) byType[q.type] = (byType[q.type] || 0) + 1;
    const low = questions.filter((q) => q.confidence < 0.75 || q.issues.length);
    const stats = {
      blocks: blocks.length,
      paragraphs: blocks.filter((b) => b.kind === 'p').length,
      tables: blocks.filter((b) => b.kind === 'table').length,
      images: mediaTargets.size,
      lines: seg.lines.length,
      tableBank: usedTableBank,
    };
    // 原文行流（给「原文」面板用）
    const sourceLines = seg.lines.map((l) => ({
      no: l.no,
      kind: l.kind,
      block: l.block ? l.block.idx : -1,
      text: (l.text || '').replace(/\t/g, ' ').slice(0, 400),
      num: l.numText || '',
      style: l.styleName || '',
      red: (l.redRatio || 0) > 0.6,
      bold: (l.boldRatio || 0) > 0.6,
      hidden: !!l.hidden,
      white: !!l.white,
    }));
    return {
      lines: sourceLines,
      fileName: opts.fileName || '未命名.docx',
      title: titleLines.join(' ').trim(),
      meta: { parsedAt: new Date().toISOString(), tables: stats.tables, images: stats.images },
      sections: sections.map((s) => ({ key: s.key, name: s.name, type: s.type, count: s.count })),
      questions,
      report: {
        total: questions.length,
        byType,
        stats,
        lowConfidence: low.map((q) => q.id),
        issues: low.map((q) => ({ id: q.id, confidence: q.confidence, issues: q.issues })),
        strayLines: strayLines.slice(0, 30),
        duplicates,
        titleLines,
      },
    };
  }

  const api = { parseDocx, parseXml, splitOptions, parseAnswerRaw, typeFromName };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else global.DocxParser = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 刷题闭环 v0.4 —— 多题库 / 随机·顺序·错题 / 限时模拟考 / 错题本 / 本机续刷 */
(function (global) {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  const LS = { lib: 'quiz.library.v1', wrong: 'quiz.wrong.v1', sessions: 'quiz.sessions.v1', marks: 'quiz.marks.v1', history: 'quiz.history.v1', legacyBank: 'quiz.bank.v1', legacySession: 'quiz.session.v1' };
  const AMOUNT_PRESETS = [20, 50, 100, 0];
  const DURATIONS = [15, 30, 60, 90, 120];
  const TYPE_NAME = { single: '单选', multi: '多选', judge: '判断', fill: '填空', short: '简答', unknown: '其他' };
  const LETTERS = 'ABCDEFGHIJ';

  let deps = null;
  let lib = { current: null, banks: {} };
  let bank = null;
  let wrongBook = {};
  let marks = {};
  let history = {};
  let session = null;
  let pendingResume = null;
  let timerId = null;
  let setup = { mode: 'random', amount: 0, duration: 30, shuffle: true, customDur: false, amountCustom: false, amountValue: 50, types: null };
  const expanded = new Set();

  // ---------------------------------------------------------------- 基础
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const plain = (nodes) => deps.plainOf(nodes || []);
  const rich = (nodes) => deps.rich(nodes || []);
  const buzz = (p) => { try { if (deps && deps.buzz) setTimeout(() => deps.buzz(p), 0); } catch (e) { /* ignore */ } };
  const toast = (m) => { if (deps && deps.toast) deps.toast(m); };

  function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

  function norm(s) {
    let t = String(s || '');
    t = t.replace(/[\uFF01-\uFF5E]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
    t = t.replace(/\u3000/g, ' ').replace(/\s+/g, '');
    t = t.replace(/[，,。.、；;：:！!？?（）()【】\[\]“”"'‘’《》<>·…\-—_/\\|]/g, '');
    return t.toLowerCase();
  }
  function splitParts(s) { return String(s || '').split(/[；;、|]/).map((x) => x.trim()).filter(Boolean); }
  function shuffle(a) {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  }
  function remapLetters(ansLetters, order) {
    const pos = {};
    order.forEach((k, i) => { pos[k] = LETTERS[i]; });
    return ansLetters.map((k) => pos[k]).filter(Boolean);
  }

  // ---------------------------------------------------------------- 题库库
  function bankKeyOf(res) {
    const qs = res.questions || [];
    return [res.fileName || '', qs.length, qs[0] ? qs[0].id : '', qs[qs.length - 1] ? qs[qs.length - 1].id : ''].join('|');
  }
  function loadLibrary() {
    lib = lsGet(LS.lib) || { current: null, banks: {} };
    if (!lib.banks) lib.banks = {};
    // 迁移老版本：单题库 + 单会话
    if (!Object.keys(lib.banks).length) {
      const old = lsGet(LS.legacyBank);
      if (old && old.questions && old.questions.length) {
        lib.banks[old.key] = old;
        lib.current = old.key;
        persistLibrary();
        lsDel(LS.legacyBank);
      }
    }
    const legacySession = lsGet(LS.legacySession);
    if (legacySession && legacySession.bankKey && lib.banks[legacySession.bankKey]) {
      const ss = lsGet(LS.sessions) || {};
      if (!ss[legacySession.bankKey]) { ss[legacySession.bankKey] = legacySession; lsSet(LS.sessions, ss); }
      lsDel(LS.legacySession);
    }
  }
  function persistLibrary() {
    if (lsSet(LS.lib, lib)) return true;
    toast('本机存不下更多题库了，先删掉一个旧的');
    return false;
  }
  function loadWrong() { wrongBook = lsGet(LS.wrong) || {}; }
  function saveWrong() { lsSet(LS.wrong, wrongBook); }
  function wrongOf(key) { return wrongBook[key || (bank && bank.key)] || {}; }
  function loadMarks() { marks = lsGet(LS.marks) || {}; }
  function loadHistory() { history = lsGet(LS.history) || {}; }
  function saveHistory() { lsSet(LS.history, history); }
  function pushHistory(rec) {
    if (!bank) return;
    const arr = history[bank.key] || (history[bank.key] = []);
    arr.unshift(rec);
    if (arr.length > 60) arr.length = 60;
    saveHistory();
  }
  function marksOf(qid) {
    if (!bank) return {};
    const m = marks[bank.key] || {};
    return m[qid] || {};
  }
  function setMark(qid, kind, val) {
    if (!bank) return;
    const m = marks[bank.key] || (marks[bank.key] = {});
    const rec = m[qid] || (m[qid] = {});
    if (val) rec[kind] = true; else delete rec[kind];
    lsSet(LS.marks, marks);
  }
  function sessionsMap() { return lsGet(LS.sessions) || {}; }
  let saveTimer = null;
  function saveSessionNow() {
    if (!session) return;
    const m = sessionsMap();
    m[session.bankKey] = session;
    lsSet(LS.sessions, m);
  }
  // App 里写的是 SharedPreferences，每次答题都整段写会卡，合并一下
  function scheduleSave() {
    if (saveTimer) return;
    saveTimer = setTimeout(() => { saveTimer = null; saveSessionNow(); }, 500);
  }
  function flushSave() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    saveSessionNow();
  }
  function dropSession(bankKey) {
    const m = sessionsMap();
    delete m[bankKey];
    lsSet(LS.sessions, m);
  }

  function setActiveBank(key) {
    lib.current = key;
    bank = (key && lib.banks[key]) || null;
    session = null;
    pendingResume = null;
    setup.types = null;
    if (bank) {
      const s = sessionsMap()[bank.key];
      if (s && s.bankKey === bank.key && !s.finished) pendingResume = s;
    }
    persistLibrary();
    if (deps && deps.onBankChange) deps.onBankChange(bank);
    render();
  }

  function addBank(res) {
    if (!res || !res.questions || !res.questions.length) return;
    const key = bankKeyOf(res);
    const prevKey = lib.current;
    lib.banks[key] = {
      key, fileName: res.fileName, title: res.title || '',
      sections: res.sections || [], questions: res.questions,
      report: res.report, lines: res.lines || [], addedAt: Date.now(),
    };
    lib.current = key;
    if (!persistLibrary()) { if (prevKey && lib.banks[prevKey]) lib.current = prevKey; }
    bank = lib.banks[lib.current] || null;
    session = null;
    pendingResume = null;
    setup.types = null;
    if (deps && deps.onBankChange) deps.onBankChange(bank);
    render();
  }

  function deleteBank(key) {
    if (!lib.banks[key]) return;
    const wasCurrent = lib.current === key;
    delete lib.banks[key];
    delete wrongBook[key];
    saveWrong();
    delete marks[key]; lsSet(LS.marks, marks);
    delete history[key]; saveHistory();
    dropSession(key);
    if (wasCurrent) {
      const keys = Object.keys(lib.banks).sort((a, b) => (lib.banks[b].addedAt || 0) - (lib.banks[a].addedAt || 0));
      lib.current = keys.length ? keys[0] : null;
      bank = lib.current ? lib.banks[lib.current] : null;
      session = null;
      pendingResume = null;
      if (deps && deps.onBankChange) deps.onBankChange(bank);
    }
    persistLibrary();
    render();
    renderSheet();
    if (!bank) { const w = $('#wrongroot'); if (w) renderWrong(w); }
  }

  // ---------------------------------------------------------------- 题库浮层
  function renderSheet() {
    const box = $('#banklist');
    if (!box) return;
    const keys = Object.keys(lib.banks).sort((a, b) => (lib.banks[b].addedAt || 0) - (lib.banks[a].addedAt || 0));
    if (!keys.length) {
      box.innerHTML = '<div class="sheet-empty">还没有题库。<br>点下面「导入 Word」选一份 .docx</div>';
      return;
    }
    box.innerHTML = keys.map((k) => {
      const b = lib.banks[k];
      const n = (b.questions || []).length;
      const w = Object.keys(wrongBook[k] || {}).length;
      const cur = k === lib.current;
      return `<div class="bank ${cur ? 'cur' : ''}" data-k="${esc(k)}">
        <div class="b-main" data-pick="${esc(k)}">
          <div class="b-nm">${esc(b.fileName || b.title || '题库')}</div>
          <div class="b-meta">${n} 题${w ? ' · 错题 ' + w : ''}${cur ? ' · 当前' : ''}</div>
        </div>
        ${cur ? '<span class="b-cur">使用中</span>' : '<button class="b-pick" data-pick2="' + esc(k) + '">用这个</button>'}
        <button class="b-del" data-del="${esc(k)}">删</button>
      </div>`;
    }).join('');
    $$('#banklist [data-pick]', box).forEach((el) => el.addEventListener('click', () => {
      if (el.dataset.pick !== lib.current) { buzz(10); setActiveBank(el.dataset.pick); renderSheet(); }
      closeSheet();
    }));
    $$('#banklist [data-pick2]', box).forEach((el) => el.addEventListener('click', () => {
      buzz(10); setActiveBank(el.dataset.pick2); renderSheet(); closeSheet();
    }));
    $$('#banklist [data-del]', box).forEach((el) => el.addEventListener('click', (e) => {
      e.stopPropagation();
      const k = el.dataset.del;
      const b = lib.banks[k];
      if (!confirm('删除「' + (b.fileName || '题库') + '」？进度和错题也会一起删掉。')) return;
      buzz([0, 15, 30, 15]);
      deleteBank(k);
    }));
  }
  function openSheet() { renderSheet(); $('#sheet').hidden = false; buzz(6); }
  function closeSheet() { $('#sheet').hidden = true; }

  // ---------------------------------------------------------------- 会话
  function buildItems(questions, shuffleOptions) {
    return questions.map((q) => {
      const opts = (q.options || []).map((o) => ({ key: o.key, content: o.content }));
      let order = opts.map((o) => o.key);
      if (shuffleOptions && opts.length > 1 && q.type !== 'judge') order = shuffle(order);
      const display = order.map((k, i) => {
        const src = opts.find((o) => o.key === k);
        return { key: LETTERS[i], content: src ? src.content : [] };
      });
      const ansLetters = q.answer && q.answer.letters ? q.answer.letters : [];
      return {
        qid: q.id, key: q.type, options: display,
        ansKeys: shuffleOptions && opts.length > 1 && q.type !== 'judge' ? remapLetters(ansLetters, order) : ansLetters.slice(),
      };
    });
  }

  function resumeCandidate() {
    if (!pendingResume || !bank || pendingResume.bankKey !== bank.key) return null;
    const items = pendingResume.items || [];
    let i = pendingResume.idx || 0;
    while (i < items.length && pendingResume.results && pendingResume.results[items[i].qid]) i++;
    if (i >= items.length) return null;
    return { data: pendingResume, idx: i };
  }

  function startSession(mode, amount, shuffleOpts, duration) {
    if (!bank) { toast('先导入或选择一个题库'); return; }
    const types = selectedTypes();
    if (!types.length) { toast('至少选一种题型'); return; }
    let pool = bank.questions.filter((q) => types.includes(q.type));
    const wk = wrongOf();
    if (mode === 'wrong') {
      pool = pool.filter((q) => wk[q.id]).sort((a, b) => (wk[b.id] || 0) - (wk[a.id] || 0));
      if (!pool.length) { toast('这个题库还没有错题'); return; }
    } else if (mode === 'random') {
      pool = shuffle(pool);
    }
    const n = mode === 'exam' ? (amount > 0 ? amount : pool.length) : amount;
    if (n > 0) pool = pool.slice(0, n);
    const items = buildItems(pool, shuffleOpts);
    pendingResume = null;
    const base = {
      bankKey: bank.key, mode, amount, shuffle: shuffleOpts, ids: pool.map((q) => q.id),
      idx: 0, finished: false, results: {}, skipped: [], startedAt: Date.now(), items,
    };
    if (mode === 'exam') {
      base.durationSec = (duration || 20) * 60;
      base.deadline = Date.now() + base.durationSec * 1000;
      base.picked = {};
    }
    session = base;
    saveSessionNow();
    render();
  }

  function availTypes() {
    const m = {};
    (bank ? bank.questions : []).forEach((q) => { m[q.type] = (m[q.type] || 0) + 1; });
    return m;
  }
  function selectedTypes() {
    const avail = availTypes();
    const all = Object.keys(avail);
    if (!setup.types) return all;
    const sel = setup.types.filter((t) => avail[t]);
    return sel.length ? sel : all;
  }

  function currentItem() { return session ? session.items[session.idx] || null : null; }
  function questionOf(id) { return bank ? bank.questions.find((q) => q.id === id) : null; }

  // ---------------------------------------------------------------- 判分
  function judge(q, item, pickedKeys, fillText) {
    if (q.type === 'fill' || q.type === 'short') return judgeFill(q, fillText);
    const right = (item.ansKeys || []).slice().sort().join('');
    const got = (pickedKeys || []).slice().sort().join('');
    return { ok: right !== '' && right === got, right, got };
  }
  function judgeFill(q, input) {
    const ans = q.answer || {};
    const ansText = ans.text || '';
    const userParts = splitParts(input);
    const ansParts = splitParts(ansText);
    let ok;
    if (ansParts.length > 1) ok = userParts.length === ansParts.length && ansParts.every((p, i) => norm(p) === norm(userParts[i]));
    else ok = ansParts.length === 1 && norm(ansText) === norm(input);
    return { ok, right: ansParts.length ? ansParts.join(' / ') : ansText };
  }

  // ---------------------------------------------------------------- 渲染总入口
  function syncChrome() {
    const pane = document.getElementById('pane-quiz');
    const onQuiz = !pane || !pane.hidden;
    const inSession = onQuiz && !!(session && !session.finished && session.idx < session.items.length);
    document.body.classList.toggle('quiz-session', inSession);
  }

  function markFinished() {
    if (!session || session.finished) return;
    session.finished = true;
    if (!session.recorded) {
      const results = session.results || {};
      const total = session.items.length || 0;
      const right = Object.values(results).filter((r) => r.ok).length;
      const sec = Math.round((session.elapsed != null ? session.elapsed : (Date.now() - (session.startedAt || Date.now())) / 1000));
      pushHistory({
        at: Date.now(), mode: session.mode, total, right, wrong: Math.max(0, total - right),
        skipped: (session.skipped || []).length, sec,
        pct: total ? Math.round((right / total) * 100) : 0,
      });
      session.recorded = true;
    }
    flushSave();
  }

  function render() {
    const root = $('#quizroot');
    if (!root) return;
    syncChrome();
    if (!bank) {
      stopTimer();
      root.innerHTML = '<div class="empty"><b>还没有题库</b><br>点右上角「导入」选一份 .docx，<br>或点「题库 → 加载示例」先看看。</div>';
      return;
    }
    if (!session) { stopTimer(); renderSetup(root); return; }
    if (session.finished) { stopTimer(); renderDone(root); return; }
    if (session.idx >= session.items.length) {
      if (session.mode === 'exam') { submitExam(true); return; }
      markFinished(); stopTimer(); renderDone(root); return;
    }
    renderQuestion(root);
  }

  function renderSetup(root) {
    const total = bank.questions.length;
    const wk = wrongOf();
    const wrongN = Object.keys(wk).length;
    const cand = resumeCandidate();
    const isExam = setup.mode === 'exam';
    const avail = availTypes();
    const sel = selectedTypes();
    const poolCount = bank.questions.filter((q) => sel.includes(q.type)).length;
    const typeChips = Object.keys(avail).map((t) =>
      `<button class="amon ${sel.includes(t) ? 'on' : ''}" data-type="${t}">${TYPE_NAME[t] || t} ${avail[t]}</button>`).join('');
    const amountBtns = AMOUNT_PRESETS.map((n) =>
      `<button class="amon ${!setup.amountCustom && setup.amount === n ? 'on' : ''}" data-amount="${n}">${n === 0 ? '全部 ' + poolCount : n + ' 题'}</button>`).join('')
      + `<button class="amon ${setup.amountCustom ? 'on' : ''}" data-amount="custom">自定义</button>`;
    const custom = !DURATIONS.includes(setup.duration) || setup.customDur;
    const durationBtns = DURATIONS.map((m) => `<button class="amon ${!custom && setup.duration === m ? 'on' : ''}" data-dur="${m}">${m} 分钟</button>`).join('')
      + `<button class="amon ${custom ? 'on' : ''}" data-dur="custom">自定义</button>`;
    root.innerHTML = `
      <div class="setup">
        <div class="bank-row">
          <span class="nm">${esc(bank.fileName || '题库')}</span>
          <button class="chg" id="qz-banks">换题库</button>
          <button class="chg" id="qz-wrongbook">错题本${wrongN ? ' ' + wrongN : ''}</button>
        </div>
        ${cand ? `<div class="qz-resume">上一组刷到 ${cand.idx}/${cand.data.items.length}，要继续吗？
          <div class="row"><button class="qz-btn" id="qz-resume">继续</button><button class="qz-btn ghost" id="qz-drop">重新开始</button></div>
        </div>` : ''}
        <div class="row">
          <button class="mode ${setup.mode === 'random' ? 'on' : ''}" data-mode="random">随机刷</button>
          <button class="mode ${setup.mode === 'order' ? 'on' : ''}" data-mode="order">顺序刷</button>
          <button class="mode ${setup.mode === 'wrong' ? 'on' : ''}" data-mode="wrong">只刷错题</button>
